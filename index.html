<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Intelligence · PowerOne Capital Markets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Instrument+Sans:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#09090C;--surface:#0F1117;--card:#13161F;--card-h:#171B26;
  --b:rgba(255,255,255,0.065);--bh:rgba(212,168,67,0.3);
  --gold:#D4A843;--gold-l:#E8C876;--gold-d:rgba(212,168,67,0.1);--gold-bd:rgba(212,168,67,0.25);
  --t1:#EDE9E0;--t2:#8A8680;--t3:#4E4B47;
  --up:#4ade80;--dn:#f87171;
  --r:12px;--rs:7px;
  --fh:'Syne',sans-serif;--fb:'Instrument Sans',sans-serif;
}
html{font-size:16px;scroll-behavior:smooth}
body{background:var(--bg);color:var(--t1);font-family:var(--fb);min-height:100vh;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:var(--fb);cursor:pointer}
.w{max-width:1300px;margin:0 auto;padding:0 2rem}
.top-bar{height:3px;background:linear-gradient(90deg,transparent,var(--gold) 30%,var(--gold-l) 60%,transparent)}

/* HEADER */
header{background:rgba(9,9,12,0.96);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--b);position:sticky;top:0;z-index:200}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:.85rem 0;gap:1rem;flex-wrap:wrap}
.brand-name{font-family:var(--fh);font-size:20px;font-weight:700;letter-spacing:-0.03em}
.brand-name em{color:var(--gold);font-style:normal}
.brand-sub{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--t3);margin-top:2px}
.hdr-r{display:flex;align-items:center;gap:1.25rem}
.mkt-pill{display:flex;align-items:center;gap:7px;padding:5px 12px;border-radius:99px;border:1px solid var(--b);background:rgba(255,255,255,.025)}
.mdot{width:7px;height:7px;border-radius:50%;background:var(--up);box-shadow:0 0 7px #4ade80aa;transition:all .3s}
.mdot.cl{background:var(--t3);box-shadow:none}
.mlbl{font-size:11px;font-weight:500;color:var(--t2)}
.clk{font-family:var(--fh);font-size:12px;font-weight:500;color:var(--t2);white-space:nowrap}

/* TRADINGVIEW TICKER */
.ticker-bar{background:var(--surface);border-bottom:1px solid var(--b);overflow:hidden;min-height:46px}
.tradingview-widget-container{min-height:46px;width:100%}
.tradingview-widget-container__widget{min-height:46px}

/* TABS */
.tnav{background:var(--surface);border-bottom:1px solid var(--b)}
.trow{display:flex;overflow-x:auto;scrollbar-width:none}
.trow::-webkit-scrollbar{display:none}
.tb{display:flex;align-items:center;gap:8px;padding:13px 22px;font-size:13px;font-weight:500;color:var(--t3);background:transparent;border:none;border-bottom:2px solid transparent;cursor:pointer;transition:color .15s,border-color .15s;white-space:nowrap;outline:none}
.tb:hover{color:var(--t2)}
.tb.on{color:var(--gold);border-bottom-color:var(--gold)}

/* MAIN */
main{padding:2rem 0 4rem}
.pn{display:none}.pn.on{display:block}
.pt{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:12px}
.ptitle{font-family:var(--fh);font-size:24px;font-weight:700;color:var(--t1);letter-spacing:-.03em}
.ptr{display:flex;align-items:center;gap:10px}
.lupd{font-size:12px;color:var(--t3)}
.rfb{display:inline-flex;align-items:center;gap:7px;padding:8px 17px;background:var(--gold-d);border:1px solid var(--gold-bd);border-radius:var(--rs);color:var(--gold);font-size:13px;font-weight:500;transition:background .15s,transform .1s;outline:none}
.rfb:hover{background:rgba(212,168,67,.18)}
.rfb:active{transform:scale(.97)}
.rfb:disabled{opacity:.35;cursor:not-allowed;transform:none}
.rfb svg{width:14px;height:14px;flex-shrink:0}
.spin{animation:sp .7s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}

/* BRIEF */
.brief{background:rgba(212,168,67,0.055);border:1px solid rgba(212,168,67,0.18);border-radius:var(--r);padding:1.1rem 1.4rem;margin-bottom:1.5rem}
.brief-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:.75rem}
.brief-lbl{font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.brief-time{font-size:11px;color:var(--t3)}
.brief-list{list-style:none;display:flex;flex-direction:column;gap:8px}
.brief-list li{font-size:13.5px;color:var(--t1);line-height:1.45;padding-left:18px;position:relative;cursor:pointer}
.brief-list li::before{content:'▸';position:absolute;left:0;color:var(--gold);font-size:10px;top:3px}
.brief-list li:hover{color:var(--gold-l)}
.bsrc{font-size:10.5px;color:var(--t3);margin-left:6px;font-style:normal}

/* NEWS GRID */
.ng{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.nc{background:var(--card);border:1px solid var(--b);border-radius:var(--r);padding:1.2rem 1.35rem;display:flex;flex-direction:column;gap:8px;transition:border-color .18s,background .18s,transform .15s;cursor:pointer;position:relative;overflow:hidden}
.nc::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--sc,var(--gold));opacity:0;transition:opacity .18s}
.nc:hover{border-color:var(--bh);background:var(--card-h);transform:translateY(-2px)}
.nc:hover::before{opacity:1}
.cm{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cs{font-size:10px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ca{font-size:11px;color:var(--t3);white-space:nowrap}
.ct{font-family:var(--fh);font-size:15px;font-weight:600;color:var(--t1);line-height:1.42;letter-spacing:-.015em}
.cd{font-size:13px;color:var(--t2);line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.cf{padding-top:8px;border-top:1px solid var(--b);margin-top:auto}
.rl{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;color:var(--gold);transition:color .15s}
.rl:hover{color:var(--gold-l)}
.rl svg{width:12px;height:12px}

/* STATES */
.es{display:flex;flex-direction:column;align-items:center;padding:4.5rem 2rem;gap:14px;text-align:center;color:var(--t3)}
.es-ico{font-size:34px;opacity:.2}
.es-h{font-family:var(--fh);font-size:16px;font-weight:600;color:var(--t2)}
.es-p{font-size:13px;max-width:400px;line-height:1.65}
.skg{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.skc{background:var(--card);border:1px solid var(--b);border-radius:var(--r);padding:1.2rem 1.35rem;height:185px;display:flex;flex-direction:column;gap:11px}
.skl{border-radius:5px;background:linear-gradient(90deg,rgba(255,255,255,.04) 0%,rgba(255,255,255,.08) 50%,rgba(255,255,255,.04) 100%);background-size:200% 100%;animation:shim 1.6s ease-in-out infinite}
@keyframes shim{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sk-s{height:10px;width:30%}.sk-t{height:14px;width:100%}.sk-t2{height:14px;width:76%}.sk-p{height:11px;width:100%}.sk-p2{height:11px;width:86%}.sk-p3{height:11px;width:60%}
.err{display:flex;align-items:flex-start;gap:10px;padding:13px 16px;background:rgba(163,45,45,.1);border:1px solid rgba(240,149,149,.22);border-radius:var(--rs);color:#F09595;font-size:13px;line-height:1.5}
.err svg{width:16px;height:16px;flex-shrink:0;margin-top:1px}

/* SOURCES */
.srcsec{margin-top:3.5rem;border-top:1px solid var(--b);padding-top:1.75rem}
.srchdr{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.srctog{display:flex;align-items:center;gap:9px;background:none;border:none;color:var(--t3);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;transition:color .15s;outline:none}
.srctog:hover{color:var(--t2)}
.srctog svg{transition:transform .22s}
.srctog.open svg.cv{transform:rotate(180deg)}
.srcgrid{display:none;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:1.25rem}
.srci{display:flex;align-items:center;gap:11px;padding:11px 15px;background:var(--card);border:1px solid var(--b);border-radius:var(--rs)}
.sdot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.sname{font-size:13px;font-weight:500;color:var(--t1)}
.scat{font-size:11px;color:var(--t3);margin-top:1px}

footer{border-top:1px solid var(--b);padding:1.5rem 0;margin-top:1rem}
.ftr{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.fl{font-size:12px;color:var(--t3)}.fl strong{color:var(--gold);font-weight:500}
.fr{font-size:11px;color:var(--t3)}

@media(max-width:768px){
  .w{padding:0 1rem}
  .clk,.brand-sub{display:none}
  .ng,.skg,.srcgrid{grid-template-columns:1fr}
  .ptitle{font-size:20px}
}
</style>
</head>
<body>

<div class="top-bar"></div>

<header>
  <div class="w">
    <div class="hdr">
      <div>
        <div class="brand-name">Market <em>Intelligence</em></div>
        <div class="brand-sub">PowerOne Capital Markets</div>
      </div>
      <div class="hdr-r">
        <div class="mkt-pill"><div class="mdot" id="mdot"></div><span class="mlbl" id="mlbl">Markets</span></div>
        <div class="clk" id="clk"></div>
      </div>
    </div>
  </div>
</header>

<!-- TradingView Ticker Tape -->
<div class="ticker-bar">
  <div class="tradingview-widget-container">
    <div class="tradingview-widget-container__widget"></div>
    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
    {
      "symbols": [
        {"proName": "TVC:GOLD",         "title": "Gold"},
        {"proName": "TVC:SILVER",        "title": "Silver"},
        {"proName": "TVC:COPPER",        "title": "Copper"},
        {"proName": "TVC:USOIL",         "title": "WTI Oil"},
        {"proName": "FOREXCOM:SPXUSD",   "title": "S&P 500"},
        {"proName": "TSX:TSX",           "title": "TSX"},
        {"proName": "FX_IDC:CADUSD",     "title": "CAD / USD"},
        {"proName": "FX:EURUSD",         "title": "EUR / USD"},
        {"proName": "FX:GBPUSD",         "title": "GBP / USD"},
        {"proName": "TVC:DXY",           "title": "USD Index"},
        {"proName": "COMEX:GC1!",        "title": "Gold Futures"},
        {"proName": "NYMEX:CL1!",        "title": "Crude Futures"}
      ],
      "showSymbolLogo": false,

      "locale": "en"
    }
    </script>

<nav class="tnav">
  <div class="w">
    <div class="trow">
      <button class="tb on" data-tab="gold">◈ Gold &amp; Metals</button>
      <button class="tb" data-tab="mining">⬡ Mining</button>
      <button class="tb" data-tab="macro">◉ Global Macro</button>
      <button class="tb" data-tab="canada">◎ Canada</button>
      <button class="tb" data-tab="us">◇ United States</button>
      <button class="tb" data-tab="europe">○ Europe</button>
    </div>
  </div>
</nav>

<main>
  <div class="w">
    <div id="panels"></div>

    <div class="srcsec">
      <div class="srchdr">
        <button class="srctog" id="srctog" onclick="toggleSrc()">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.4"/><path d="M8 5.5v3L10 10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          Approved Sources &amp; References
          <svg class="cv" width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="srcgrid" id="srcgrid"></div>
    </div>
  </div>
</main>

<footer>
  <div class="w">
    <div class="ftr">
      <div class="fl">Market Intelligence — <strong>PowerOne Capital Markets</strong></div>
      <div class="fr">Ticker: TradingView · News: Google News (Reuters, Bloomberg, BBC, FT &amp; more)</div>
    </div>
  </div>
</footer>

<script>
// ─── CONFIG ───────────────────────────────────────────────────────────────────
const TABS = [
  {
    id:'gold',   name:'Gold & Metals', color:'#D4A843',
    query:'gold price silver platinum precious metals commodities', region:'US'
  },
  {
    id:'mining', name:'Mining',        color:'#4CAF50',
    query:'gold mining copper mine mineral exploration junior miner', region:'US'
  },
  {
    id:'macro',  name:'Global Macro',  color:'#9B7FD4',
    query:'interest rates inflation central bank Federal Reserve monetary policy', region:'US'
  },
  {
    id:'canada', name:'Canada',        color:'#E05C5C',
    query:'Canada economy Bank of Canada TSX Canadian dollar markets', region:'US'
  },
  {
    id:'us',     name:'United States', color:'#5B9BD5',
    query:'Wall Street Federal Reserve US economy stocks S&P 500', region:'US'
  },
  {
    id:'europe', name:'Europe',        color:'#6EC6A0',
    query:'ECB European Central Bank eurozone European economy', region:'GB'
  }
];

const TTL   = 15 * 60 * 1000;
const cache = {};

// CORS proxies — tried in order, first success wins
const PROXIES = [
  u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
  u => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,
  u => `https://thingproxy.freeboard.io/fetch/${u}`,
];

// Source quality whitelist — only these publishers are shown
const WHITELIST = [
  'reuters','bloomberg','bbc','bbc news','financial times','ft',
  'cnbc','marketwatch','wall street journal','wsj','barron',
  'financial post','globe and mail','bnn bloomberg','cbc',
  'mining.com','kitco','northern miner','the northern miner',
  'the guardian','guardian','associated press','ap news',
  'the economist','economist','fortune','forbes',
  'new york times','nyt','washington post','axios',
  'south china morning post','nikkei','les echos','handelsblatt',
  's&p global','platts','seeking alpha','motley fool',
  'proactive investors','stockwatch','junior mining network',
];

function isReputable(src) {
  if (!src) return false;
  const s = src.toLowerCase();
  return WHITELIST.some(w => s.includes(w));
}

// Source accent colors
const SRC_CLR = {
  reuters:'#FF6B35', bloomberg:'#1967D2', bbc:'#BB1919', 'financial times':'#E8B882',
  ft:'#E8B882', cnbc:'#0097D4', marketwatch:'#00AC4F', 'wall street journal':'#888',
  wsj:'#888', 'financial post':'#E31837', 'globe and mail':'#0073CF',
  'bnn bloomberg':'#1967D2', cbc:'#D4373C', 'mining.com':'#4CAF50',
  kitco:'#D4A843', 'northern miner':'#8B6914', guardian:'#052962',
  economist:'#E3120B', 'associated press':'#5B9BD5', 'ap news':'#5B9BD5',
  'south china morning post':'#BE1622', nikkei:'#E60012',
};
function srcClr(n) {
  if (!n) return '#D4A843';
  const s = n.toLowerCase();
  for (const [k,v] of Object.entries(SRC_CLR)) { if (s.includes(k)) return v; }
  return '#8A8680';
}

// ─── CLOCK ────────────────────────────────────────────────────────────────────
function tick() {
  const now = new Date();
  const c = document.getElementById('clk');
  if (c) c.textContent = now.toLocaleString('en-CA',{weekday:'short',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true,timeZone:'America/Toronto'});
  const et = new Date(now.toLocaleString('en-US',{timeZone:'America/New_York'}));
  const d=et.getDay(), m=et.getHours()*60+et.getMinutes(), open=d>=1&&d<=5&&m>=570&&m<960;
  const dot=document.getElementById('mdot'), lbl=document.getElementById('mlbl');
  if (dot) dot.className='mdot'+(open?'':' cl');
  if (lbl) lbl.textContent=open?'Markets Open':'Markets Closed';
}
tick(); setInterval(tick,1000);

// ─── UTILS ────────────────────────────────────────────────────────────────────
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function ago(d){
  if (!d) return 'Recently';
  const s=(Date.now()-new Date(d))/1000;
  if(isNaN(s)||s<0)return'Recently';
  if(s<60)return'Just now'; if(s<3600)return Math.floor(s/60)+'m ago';
  if(s<86400)return Math.floor(s/3600)+'h ago'; return Math.floor(s/86400)+'d ago';
}
function etNow(){return new Date().toLocaleTimeString('en-CA',{hour:'2-digit',minute:'2-digit',hour12:true,timeZone:'America/Toronto'});}

// ─── GOOGLE NEWS RSS FETCHING ─────────────────────────────────────────────────
function buildGNewsURL(tab) {
  const q  = encodeURIComponent(tab.query);
  const gl = tab.region;
  const ce = `${gl}:en`;
  return `https://news.google.com/rss/search?q=${q}&hl=en&gl=${gl}&ceid=${ce}`;
}

function parseGNewsXML(xml, tabColor) {
  const doc   = new DOMParser().parseFromString(xml, 'application/xml');
  const items = Array.from(doc.querySelectorAll('item'));
  return items.slice(0, 15).map(item => {
    // Source publisher
    const sourceEl = item.querySelector('source');
    const src = sourceEl?.textContent?.trim() || '';

    // Title — Google appends " - Source" at the end; strip it
    let title = (item.querySelector('title')?.textContent || '').trim();
    if (src && title.endsWith(' - ' + src)) {
      title = title.slice(0, -(src.length + 3)).trim();
    }

    // Real article URL from description's first <a href>
    const rawDesc = item.querySelector('description')?.textContent || '';
    const hrefMatch = rawDesc.match(/href="([^"]+)"/);
    const url = hrefMatch ? hrefMatch[1] : (item.querySelector('link')?.textContent?.trim() || '');

    // Date
    const date = item.querySelector('pubDate')?.textContent?.trim() || '';

    return { title, url, date, src };
  }).filter(a => a.title && a.src && a.url);
}

async function fetchRSS(rssUrl) {
  for (const proxyFn of PROXIES) {
    try {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 12000);
      const res = await fetch(proxyFn(rssUrl), { signal: controller.signal });
      clearTimeout(timer);
      if (!res.ok) continue;
      const text = await res.text();
      if (!text.includes('<item')) continue;
      return text;
    } catch { continue; }
  }
  return null;
}

// ─── LOAD TAB ─────────────────────────────────────────────────────────────────
async function loadTab(id) {
  const tab = TABS.find(t => t.id === id);
  if (!tab) return;
  if (cache[id]?.status === 'done' && Date.now() - cache[id].ts < TTL) { paint(id); return; }
  cache[id] = { status:'loading' }; paint(id);

  try {
    const rssUrl = buildGNewsURL(tab);
    const xml    = await fetchRSS(rssUrl);

    if (!xml) throw new Error('Unable to load news feed. Please check your connection and try refreshing.');

    const all      = parseGNewsXML(xml);
    const filtered = all.filter(a => isReputable(a.src));
    // Use filtered if enough quality results, otherwise use all (Google News generally curates well)
    const articles = (filtered.length >= 4 ? filtered : all).slice(0, 9);

    if (!articles.length) throw new Error('No articles found for this topic. Try refreshing.');

    cache[id] = {
      status:'done', articles, ts:Date.now(),
      time: new Date().toLocaleTimeString('en-CA',{hour:'2-digit',minute:'2-digit',hour12:true})
    };
  } catch(e) {
    cache[id] = { status:'error', msg: e.message };
  }
  paint(id);
}

// ─── RENDER ───────────────────────────────────────────────────────────────────
function topRow(tab, s) {
  const loading = s?.status === 'loading';
  return `<div class="pt">
    <div class="ptitle">${tab.name}</div>
    <div class="ptr">
      ${s?.time ? `<span class="lupd">Updated ${s.time}</span>` : ''}
      <button class="rfb" onclick="loadTab('${tab.id}')" ${loading ? 'disabled' : ''}>
        <svg viewBox="0 0 16 16" fill="none" class="${loading?'spin':''}">
          <path d="M13.5 8A5.5 5.5 0 1 1 8 2.5a5.5 5.5 0 0 1 3.9 1.6L13.5 2.5V6h-3.5l1.4-1.4"
            stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        ${loading ? 'Fetching…' : 'Refresh'}
      </button>
    </div>
  </div>`;
}

function briefSection(articles) {
  if (!articles?.length) return '';
  return `<div class="brief">
    <div class="brief-hdr">
      <span class="brief-lbl">Today's Brief</span>
      <span class="brief-time">${etNow()} ET</span>
    </div>
    <ul class="brief-list">
      ${articles.slice(0,4).map(a =>
        `<li onclick="window.open('${esc(a.url)}','_blank')">${esc(a.title)}<em class="bsrc">— ${esc(a.src)}</em></li>`
      ).join('')}
    </ul>
  </div>`;
}

function paint(id) {
  const tab = TABS.find(t => t.id === id);
  const el  = document.getElementById('p-' + id);
  if (!el || !tab) return;
  const s = cache[id];

  if (!s) {
    el.innerHTML = topRow(tab, null) + `<div class="es">
      <div class="es-ico">📡</div>
      <div class="es-h">Ready to load</div>
      <div class="es-p">Click Refresh to pull live headlines sourced from Reuters, Bloomberg, BBC, Financial Times and more via Google News.</div>
    </div>`;
    return;
  }

  if (s.status === 'loading') {
    el.innerHTML = topRow(tab, s) + `<div class="skg">
      ${Array(9).fill(0).map(() => `<div class="skc">
        <div class="skl sk-s"></div><div class="skl sk-t"></div><div class="skl sk-t2"></div>
        <div class="skl sk-p"></div><div class="skl sk-p2"></div><div class="skl sk-p3"></div>
      </div>`).join('')}
    </div>`;
    return;
  }

  if (s.status === 'error') {
    el.innerHTML = topRow(tab, s) + `<div class="err">
      <svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.4"/>
      <path d="M8 5v4M8 11v.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <span>${esc(s.msg)}</span>
    </div>`;
    return;
  }

  if (s.status === 'done') {
    el.innerHTML = topRow(tab, s) + briefSection(s.articles) + `<div class="ng">
      ${s.articles.map(a => {
        const c = srcClr(a.src);
        return `<div class="nc" style="--sc:${c}" onclick="window.open('${esc(a.url)}','_blank')">
          <div class="cm">
            <span class="cs" style="color:${c}">${esc(a.src)}</span>
            <span class="ca">${ago(a.date)}</span>
          </div>
          <div class="ct">${esc(a.title)}</div>
          <div class="cf">
            <a class="rl" href="${esc(a.url)}" target="_blank" onclick="event.stopPropagation()">
              Read article
              <svg viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </a>
          </div>
        </div>`;
      }).join('')}
    </div>`;
  }
}

// ─── SOURCES PANEL ────────────────────────────────────────────────────────────
function buildSrc() {
  document.getElementById('srcgrid').innerHTML = [
    {name:'Reuters',          cat:'Global · All tabs',       color:'#FF6B35'},
    {name:'Bloomberg',        cat:'Markets, Finance',        color:'#1967D2'},
    {name:'Financial Times',  cat:'Business, Economy',       color:'#E8B882'},
    {name:'BBC Business',     cat:'Global, Europe',          color:'#BB1919'},
    {name:'The Economist',    cat:'Macro, Europe',           color:'#E3120B'},
    {name:'CNBC',             cat:'US, Global Markets',      color:'#0097D4'},
    {name:'MarketWatch',      cat:'United States',           color:'#00AC4F'},
    {name:'Wall Street Journal',cat:'United States',         color:'#888'},
    {name:'Associated Press', cat:'Global · Breaking',       color:'#5B9BD5'},
    {name:'Financial Post',   cat:'Canada',                  color:'#E31837'},
    {name:'Globe & Mail',     cat:'Canada',                  color:'#0073CF'},
    {name:'BNN Bloomberg',    cat:'Canada · Markets',        color:'#1967D2'},
    {name:'CBC Business',     cat:'Canada',                  color:'#D4373C'},
    {name:'Mining.com',       cat:'Gold & Mining',           color:'#4CAF50'},
    {name:'Kitco News',       cat:'Precious Metals',         color:'#D4A843'},
    {name:'Northern Miner',   cat:'Mining Industry',         color:'#8B6914'},
    {name:'The Guardian',     cat:'Europe, Global',          color:'#052962'},
    {name:'S&P Global',       cat:'Ratings, Commodities',    color:'#CC2529'},
  ].map(s => `<div class="srci">
    <div class="sdot" style="background:${s.color}"></div>
    <div><div class="sname">${esc(s.name)}</div><div class="scat">${esc(s.cat)}</div></div>
  </div>`).join('');
}

function toggleSrc() {
  const g=document.getElementById('srcgrid'), t=document.getElementById('srctog');
  const open=g.style.display==='grid';
  g.style.display=open?'none':'grid';
  t.classList.toggle('open',!open);
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
function init() {
  const panels = document.getElementById('panels');
  TABS.forEach(tab => {
    const d = document.createElement('div');
    d.className = 'pn' + (tab.id === 'gold' ? ' on' : '');
    d.id = 'p-' + tab.id;
    panels.appendChild(d);
    paint(tab.id);
  });
  document.querySelectorAll('.tb').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tb').forEach(b => b.classList.remove('on'));
      document.querySelectorAll('.pn').forEach(p => p.classList.remove('on'));
      btn.classList.add('on');
      const id = btn.dataset.tab;
      document.getElementById('p-' + id).classList.add('on');
      if (!cache[id]) loadTab(id);
    });
  });
  buildSrc();
  loadTab('gold');
}

init();
</script>
