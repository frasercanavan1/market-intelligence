<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Instrument+Sans:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#09090C;--surface:#0F1117;--card:#13161F;--card-h:#171B26;
  --b:rgba(255,255,255,0.065);--bh:rgba(212,168,67,0.3);
  --gold:#D4A843;--gold-l:#E8C876;--gold-d:rgba(212,168,67,0.1);--gold-bd:rgba(212,168,67,0.25);
  --t1:#EDE9E0;--t2:#8A8680;--t3:#4E4B47;
  --up:#4ade80;--dn:#f87171;
  --r:12px;--rs:7px;
  --fh:'Syne',sans-serif;--fb:'Instrument Sans',sans-serif;
}
html{font-size:16px;scroll-behavior:smooth}
body{background:var(--bg);color:var(--t1);font-family:var(--fb);min-height:100vh;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:var(--fb);cursor:pointer}
.w{max-width:1340px;margin:0 auto;padding:0 2rem}
.top-bar{height:3px;background:linear-gradient(90deg,transparent,var(--gold) 30%,var(--gold-l) 60%,transparent)}

/* HEADER */
header{background:rgba(9,9,12,0.96);backdrop-filter:blur(16px);border-bottom:1px solid var(--b);position:sticky;top:0;z-index:200}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:.85rem 0;gap:1rem;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand-name{font-family:var(--fh);font-size:19px;font-weight:800;letter-spacing:-0.03em;color:var(--t1)}
.brand-name em{color:var(--gold);font-style:normal}
.brand-div{width:1px;height:16px;background:var(--b);align-self:center}
.brand-sub{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--t3)}
.hdr-r{display:flex;align-items:center;gap:1.25rem}
.mkt-pill{display:flex;align-items:center;gap:7px;padding:5px 12px;border-radius:99px;border:1px solid var(--b);background:rgba(255,255,255,.025)}
.mdot{width:7px;height:7px;border-radius:50%;background:var(--up);box-shadow:0 0 7px #4ade80aa;transition:all .3s}
.mdot.cl{background:var(--t3);box-shadow:none}
.mlbl{font-size:11px;font-weight:500;color:var(--t2)}
.clk{font-family:var(--fh);font-size:12px;font-weight:500;color:var(--t2);white-space:nowrap}
.ai-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;border:1px solid rgba(155,127,212,0.35);background:rgba(155,127,212,0.08);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#C4AEFF}
.ai-dot{width:5px;height:5px;border-radius:50%;background:#C4AEFF;box-shadow:0 0 6px #C4AEFFaa}

/* TICKER TAPE */
.ticker-bar{background:var(--surface);border-bottom:1px solid var(--b);overflow:hidden;min-height:46px}
.tradingview-widget-container,.tradingview-widget-container__widget{min-height:46px;width:100%}

/* TABS */
.tnav{background:var(--surface);border-bottom:1px solid var(--b)}
.trow{display:flex;overflow-x:auto;scrollbar-width:none;padding:0 2rem;max-width:1340px;margin:0 auto}
.trow::-webkit-scrollbar{display:none}
.tb{display:flex;align-items:center;gap:7px;padding:12px 20px;font-size:12.5px;font-weight:600;color:var(--t3);background:transparent;border:none;border-bottom:2px solid transparent;cursor:pointer;transition:color .15s,border-color .15s;white-space:nowrap;outline:none;letter-spacing:.01em}
.tb:hover{color:var(--t2)}
.tb.on{color:var(--gold);border-bottom-color:var(--gold)}
.tb-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

/* MAIN */
main{padding:2rem 0 4rem}
.pn{display:none}.pn.on{display:block}

/* SECTION HEADER */
.sec-hdr{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:12px}
.sec-title{font-family:var(--fh);font-size:24px;font-weight:700;color:var(--t1);letter-spacing:-.03em;line-height:1.2}
.sec-sub{font-size:13px;color:var(--t3);margin-top:4px}
.lupd{font-size:12px;color:var(--t3)}
.rfb{display:inline-flex;align-items:center;gap:7px;padding:8px 17px;background:var(--gold-d);border:1px solid var(--gold-bd);border-radius:var(--rs);color:var(--gold);font-size:13px;font-weight:500;transition:background .15s,transform .1s;outline:none}
.rfb:hover{background:rgba(212,168,67,.18)}
.rfb:active{transform:scale(.97)}
.rfb:disabled{opacity:.35;cursor:not-allowed;transform:none}
.rfb svg{width:14px;height:14px;flex-shrink:0}
.spin{animation:sp .7s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}

/* MACRO CARDS */
.macro-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:2rem}
.macro-card{background:var(--card);border:1px solid var(--b);border-radius:var(--r);padding:1.1rem 1.25rem;display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden;transition:border-color .2s}
.macro-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--mc,var(--gold))}
.macro-card:hover{border-color:rgba(212,168,67,.2)}
.macro-label{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--t3)}
.macro-price{font-family:var(--fh);font-size:22px;font-weight:700;color:var(--t1);letter-spacing:-.02em;margin-top:2px}
.macro-price.loading{color:var(--t3);font-size:18px}
.macro-source{font-size:10px;color:var(--t3);margin-top:4px}

/* LIVE STOCKS WIDGET */
.stocks-section{margin-bottom:2rem}
.stocks-label{font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:.75rem;display:flex;align-items:center;gap:8px}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--up);box-shadow:0 0 6px #4ade80aa;flex-shrink:0;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 6px #4ade80aa}50%{opacity:.5;box-shadow:0 0 2px #4ade8066}}
.tv-market-widget{border-radius:var(--r);overflow:hidden;border:1px solid var(--b);background:var(--card)}

/* SECTOR TAPE */
.sector-ticker{margin-bottom:1.25rem;border-radius:var(--r);overflow:hidden;border:1px solid var(--b)}

/* PORTFOLIO COMPANIES */
.portfolio-sec{margin-bottom:2rem}
.portfolio-label{font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:.9rem}
.portfolio-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:11px}
.company-card{background:var(--card);border:1px solid var(--b);border-radius:var(--r);padding:1rem 1.2rem;display:flex;align-items:flex-start;gap:12px;transition:border-color .18s,background .18s;cursor:pointer}
.company-card:hover{border-color:rgba(255,255,255,.14);background:var(--card-h)}
.company-card.no-link{cursor:default}
.company-card.no-link:hover{border-color:var(--b);background:var(--card)}
.company-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;font-family:var(--fh);flex-shrink:0;letter-spacing:-.02em}
.company-info{flex:1;min-width:0}
.company-name{font-size:13.5px;font-weight:600;color:var(--t1);font-family:var(--fh);letter-spacing:-.01em}
.company-ticker-row{display:flex;align-items:center;gap:5px;margin-top:3px;flex-wrap:wrap}
.ticker-badge{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;padding:2px 7px;border-radius:4px;border:1px solid}
.exchange-badge{font-size:9.5px;color:var(--t3);letter-spacing:.06em;text-transform:uppercase}
.tv-link-badge{font-size:9px;color:var(--gold);letter-spacing:.05em;opacity:.7}
.company-desc{font-size:11.5px;color:var(--t3);margin-top:4px;line-height:1.5}
.private-badge{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:4px;background:rgba(255,255,255,.04);border:1px solid var(--b);color:var(--t3)}
.deal-badge{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:4px;background:rgba(212,168,67,0.08);border:1px solid rgba(212,168,67,0.25);color:var(--gold)}
.portfolio-section-label{font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--t3);padding:10px 0 8px;margin-top:8px;border-top:1px solid var(--b)}
.portfolio-section-label:first-child{border-top:none;margin-top:0;padding-top:0}

/* BRIEF */
.brief{background:rgba(212,168,67,0.055);border:1px solid rgba(212,168,67,0.18);border-radius:var(--r);padding:1.1rem 1.4rem;margin-bottom:1.5rem}
.brief-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:.75rem}
.brief-lbl{font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.brief-time{font-size:11px;color:var(--t3)}
.brief-list{list-style:none;display:flex;flex-direction:column;gap:8px}
.brief-list li{font-size:13.5px;color:var(--t1);line-height:1.45;padding-left:18px;position:relative;cursor:pointer}
.brief-list li::before{content:'▸';position:absolute;left:0;color:var(--gold);font-size:10px;top:3px}
.brief-list li:hover{color:var(--gold-l)}
.bsrc{font-size:10.5px;color:var(--t3);margin-left:6px}

/* AI NOTICE */
.ai-news-notice{display:flex;align-items:center;gap:8px;padding:8px 13px;background:rgba(155,127,212,0.06);border:1px solid rgba(155,127,212,0.18);border-radius:var(--rs);margin-bottom:1rem;font-size:11.5px;color:rgba(196,174,255,0.7)}
.ai-news-notice svg{width:13px;height:13px;flex-shrink:0;color:#C4AEFF}

/* HOSTING NOTICE */
.host-notice{background:rgba(212,168,67,0.07);border:1px solid rgba(212,168,67,0.25);border-radius:var(--r);padding:1.25rem 1.5rem;margin-bottom:1.5rem}
.host-notice h3{font-family:var(--fh);font-size:14px;font-weight:700;color:var(--gold);margin-bottom:.5rem;letter-spacing:-.01em}
.host-notice p{font-size:13px;color:var(--t2);line-height:1.6;margin-bottom:.75rem}
.host-notice code{font-size:12px;background:rgba(255,255,255,.06);border:1px solid var(--b);border-radius:4px;padding:2px 6px;color:var(--t1);font-family:monospace}
.host-steps{list-style:none;display:flex;flex-direction:column;gap:6px;margin-top:.5rem}
.host-steps li{font-size:12.5px;color:var(--t2);padding-left:20px;position:relative;line-height:1.5}
.host-steps li::before{content:counter(step);counter-increment:step;position:absolute;left:0;color:var(--gold);font-size:11px;font-weight:700;top:1px}
.host-steps{counter-reset:step}
.host-link{color:var(--gold);text-decoration:underline;text-underline-offset:2px}

/* NEWS GRID */
.news-label{font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--t3);margin-bottom:.9rem}
.ng{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.nc{background:var(--card);border:1px solid var(--b);border-radius:var(--r);padding:1.2rem 1.35rem;display:flex;flex-direction:column;gap:8px;transition:border-color .18s,background .18s,transform .15s;cursor:pointer;position:relative;overflow:hidden}
.nc::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--sc,var(--gold));opacity:0;transition:opacity .18s}
.nc:hover{border-color:var(--bh);background:var(--card-h);transform:translateY(-2px)}
.nc:hover::before{opacity:1}
.cm{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cs{font-size:10px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ca{font-size:11px;color:var(--t3);white-space:nowrap}
.ct{font-family:var(--fh);font-size:15px;font-weight:600;color:var(--t1);line-height:1.42;letter-spacing:-.015em}
.cx{font-size:12px;color:var(--t2);line-height:1.5}
.cf{padding-top:8px;border-top:1px solid var(--b);margin-top:auto}
.rl{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;color:var(--gold);transition:color .15s}
.rl:hover{color:var(--gold-l)}
.rl svg{width:12px;height:12px}

/* STATES */
.es{display:flex;flex-direction:column;align-items:center;padding:3.5rem 2rem;gap:14px;text-align:center;color:var(--t3)}
.es-ico{font-size:32px;opacity:.2}
.es-h{font-family:var(--fh);font-size:15px;font-weight:600;color:var(--t2)}
.es-p{font-size:13px;max-width:380px;line-height:1.65}
.skg{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.skc{background:var(--card);border:1px solid var(--b);border-radius:var(--r);padding:1.2rem 1.35rem;height:165px;display:flex;flex-direction:column;gap:11px}
.skl{border-radius:5px;background:linear-gradient(90deg,rgba(255,255,255,.04) 0%,rgba(255,255,255,.08) 50%,rgba(255,255,255,.04) 100%);background-size:200% 100%;animation:shim 1.6s ease-in-out infinite}
@keyframes shim{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sk-s{height:10px;width:30%}.sk-t{height:14px;width:100%}.sk-t2{height:14px;width:76%}.sk-p{height:11px;width:100%}.sk-p2{height:11px;width:86%}
.err{display:flex;align-items:flex-start;gap:10px;padding:13px 16px;background:rgba(163,45,45,.1);border:1px solid rgba(240,149,149,.22);border-radius:var(--rs);color:#F09595;font-size:13px;line-height:1.5}
.err svg{width:16px;height:16px;flex-shrink:0;margin-top:1px}
.sec-divider{height:1px;background:var(--b);margin:2rem 0}

footer{border-top:1px solid var(--b);padding:1.5rem 0;margin-top:1rem}
.ftr{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.fl{font-size:12px;color:var(--t3)}.fl strong{color:var(--gold);font-weight:500}
.fr{font-size:11px;color:var(--t3)}

@media(max-width:900px){
  .w,.trow{padding:0 1rem}
  .clk,.brand-div,.brand-sub{display:none}
  .ng,.skg,.portfolio-grid,.macro-grid{grid-template-columns:1fr}
  .sec-title{font-size:20px}
}
</style>
</head>

function tick(){

// AI NEWS — multi-turn agentic fetch
// ════════════════════════════════════════════════════════
async function callClaude(messages, system, useSearch){
  const key = ANTHROPIC_API_KEY || '';
  const body = {
    model:'claude-sonnet-4-20250514',
    max_tokens:2000,
    system,
    messages,
  };
  if(useSearch) body.tools=[{type:'web_search_20250305',name:'web_search'}];
  const r = await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json',...(key?{'x-api-key':key}:{})},
    body:JSON.stringify(body),
  });
  if(!r.ok) throw new Error('API '+r.status);
  return r.json();
}

function extractJSON(data){
  let text=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
  text=text.replace(/```json\s*/gi,'').replace(/```\s*/g,'').trim();
  const s=text.indexOf('['),e=text.lastIndexOf(']');
  if(s===-1||e===-1)return null;
  try{return JSON.parse(text.slice(s,e+1));}catch{return null;}
}

async function fetchNewsAI(tab){
  const dateStr=new Date().toLocaleDateString('en-CA',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  const system=`You are a financial news curator for PowerOne Capital Markets, a Canadian investment dealer.
Search the web for the most recent news then return ONLY a valid JSON array — no markdown, no code fences, no explanation.
Each element: title (string), summary (1-2 sentences), source (publication name), url (full URL), timeAgo (e.g. "2h ago"), sentiment ("positive"|"negative"|"neutral").
Return exactly 8 items. Today is ${dateStr}.`;

  const messages=[{role:'user',content:tab.prompt}];
  let data=await callClaude(messages,system,true);

  // Agentic tool-use loop
  let itr=0;
  while(data.stop_reason==='tool_use'&&itr<6){
    itr++;
    messages.push({role:'assistant',content:data.content});
    const results=(data.content||[])
      .filter(b=>b.type==='tool_use')
      .map(b=>({type:'tool_result',tool_use_id:b.id,content:Array.isArray(b.content)?JSON.stringify(b.content):(b.content||'')}));
    if(!results.length)break;
    messages.push({role:'user',content:results});
    data=await callClaude(messages,system,true);
  }

  const parsed=extractJSON(data);
  if(parsed&&parsed.length>0)return parsed;

  // Fallback: reformat prose into JSON
  const prose=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
  if(prose.length>100){
    const fix=await callClaude([{role:'user',content:`Convert this news summary into a JSON array of 8 objects with fields: title, summary, source, url, timeAgo, sentiment. Return ONLY the JSON array.\n\n${prose}`}],
      'Return only valid JSON. No markdown. No explanation.',false);
    const fp=extractJSON(fix);
    if(fp&&fp.length>0)return fp;
  }
  throw new Error('Could not parse news');
}

async function loadNews(id,force=false){
  const tab=TABS.find(t=>t.id===id);
  if(!tab)return;
  if(!force&&cache[id]?.status==='done'&&Date.now()-cache[id].ts<TTL){renderNews(id);return;}
  cache[id]={status:'loading'};renderNews(id);
  try{
    const articles=await fetchNewsAI(tab);
    cache[id]={status:'done',articles,ts:Date.now(),time:timeNow()};
  }catch(e){
    console.error('News fetch error:',e);
    cache[id]={status:'error',msg:e.message||'Unknown error'};
  }
  renderNews(id);
}

    s.src='https://s3.tradingview.com/external-embedding/embed-widget-market-overview.js';
    s.async=true;
    s.innerHTML=JSON.stringify({
      colorTheme:'dark',dateRange:'1M',showChart:true,locale:'en',
      largeChartUrl:'',isTransparent:true,showSymbolLogo:false,
      showFloatingTooltip:false,width:'100%',height:420,
      tabs:[{title:'Holdings',symbols:${syms},originalTitle:'Holdings'}]
    });
    c.appendChild(s);
  })();
  <\/script>`;
}

// ════════════════════════════════════════════════════════
// SECTOR TAPE (compact ticker strip)
// ════════════════════════════════════════════════════════
function renderSectorTicker(tab){
  if(!tab.tvSymbols||!tab.tvSymbols.length)return'';
  const syms=tab.tvSymbols.map(s=>`{"proName":"${s}","title":"${s.split(':')[1]}"}`).join(',');
  const uid='tv-'+tab.id;
  return`<div class="sector-ticker">
    <div class="tradingview-widget-container" id="${uid}">
      <div class="tradingview-widget-container__widget"></div>
    </div>
  </div>
  <script>
  (function(){
    var s=document.createElement('script');
    s.src='https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js';
    s.async=true;
    s.innerHTML=JSON.stringify({symbols:[${syms}],showSymbolLogo:false,colorTheme:'dark',isTransparent:true,displayMode:'compact',locale:'en'});
    document.getElementById('${uid}').appendChild(s);
  })();
  <\/script>`;
}

// ════════════════════════════════════════════════════════
// PORTFOLIO COMPANY CARDS
// ════════════════════════════════════════════════════════
function tvUrl(exchange,ticker){
  if(!ticker)return null;
  const ex=(exchange||'').toUpperCase();
  const map={TSXV:'TSXV',TSX:'TSX',CSE:'CSE',NASDAQ:'NASDAQ',NYSE:'NYSE',AMEX:'AMEX',NYSE_ARCA:'AMEX'};
  const prefix=map[ex]||ex;
  return`https://www.tradingview.com/symbols/${prefix}-${ticker}/`;
}

function renderCompanies(tab){
  if(!tab.companies||!tab.companies.length)return'';
  const publicCos=tab.companies.filter(c=>c.status==='public'||!c.status);
  const dealCos=tab.companies.filter(c=>c.status==='deal');
  const privateCos=tab.companies.filter(c=>c.status==='private');

  function makeCard(c){
    const initials=c.name.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();
    const link=tvUrl(c.exchange,c.ticker);
    let badge;
    if(c.ticker){
      badge=`<div class="company-ticker-row">
        <span class="ticker-badge" style="color:${c.color};border-color:${c.color}44;background:${c.color}11">${c.ticker}</span>
        <span class="exchange-badge">${c.exchange}</span>
        ${link?`<span class="tv-link-badge">↗ chart</span>`:''}
      </div>`;
    }else if(c.status==='deal'){
      badge=`<div class="company-ticker-row"><span class="deal-badge">Deal Pipeline</span></div>`;
    }else{
      badge=`<div class="company-ticker-row"><span class="private-badge">Private · Not Listed</span></div>`;
    }
    const attrs=link?`onclick="window.open('${link}','_blank')"`:`class="no-link"`;
    return`<div class="company-card" ${attrs}>
      <div class="company-icon" style="background:${c.color}18;color:${c.color};border:1px solid ${c.color}33">${initials}</div>
      <div class="company-info">
        <div class="company-name">${esc(c.name)}</div>
        ${badge}
        <div class="company-desc">${esc(c.desc)}</div>
      </div>
    </div>`;
  }

  let html='<div class="portfolio-sec"><div class="portfolio-label">Portfolio Companies</div>';
  if(publicCos.length){
    html+=`<div class="portfolio-section-label">Public Holdings</div>`;
    html+=`<div class="portfolio-grid">${publicCos.map(makeCard).join('')}</div>`;
  }
  if(dealCos.length){
    html+=`<div class="portfolio-section-label" style="margin-top:1.25rem">Deal Pipeline</div>`;
    html+=`<div class="portfolio-grid" style="margin-top:.5rem">${dealCos.map(makeCard).join('')}</div>`;
  }
  if(privateCos.length){
    html+=`<div class="portfolio-section-label" style="margin-top:1.25rem">Private Holdings</div>`;
    html+=`<div class="portfolio-grid" style="margin-top:.5rem">${privateCos.map(makeCard).join('')}</div>`;
  }
  html+='</div>';
  return html;
}

// ════════════════════════════════════════════════════════
// OVERVIEW MACRO CARDS
// ════════════════════════════════════════════════════════
function renderOverviewCards(){
  const items=[
    {id:'gold-ov',   label:'Gold Spot',   color:'#D4A843'},
    {id:'silver-ov', label:'Silver Spot', color:'#C0C0C0'},
    {id:'copper-ov', label:'Copper',      color:'#CD7F32'},
    {id:'oil-ov',    label:'WTI Crude',   color:'#FF8C42'},
    {id:'cad-ov',    label:'CAD / USD',   color:'#E31837'},
    {id:'usd-ov',    label:'USD Index',   color:'#5B9BD5'},
  ];
  return`<div class="macro-grid">${items.map(i=>`
    <div class="macro-card" style="--mc:${i.color}">
      <div class="macro-label">${i.label}</div>
      <div class="macro-price loading" id="${i.id}">···</div>
      <div class="macro-source">metals.live · er-api.com</div>
    </div>`).join('')}</div>`;
}

async function loadMacroCards(){
  try{
    const d=await(await fetch('https://api.metals.live/v1/spot')).json();
    const data=Array.isArray(d)?Object.assign({},...d):d;
    const set=(id,v)=>{const el=document.getElementById(id);if(el){el.textContent=v;el.classList.remove('loading');}};
    if(data.gold)   set('gold-ov',  '$'+Number(data.gold).toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2}));
    if(data.silver) set('silver-ov','$'+Number(data.silver).toFixed(2));
    if(data.copper) set('copper-ov','$'+Number(data.copper).toFixed(2));
  }catch{}
  try{
    const d=await(await fetch('https://open.er-api.com/v6/latest/USD')).json();
    const set=(id,v)=>{const el=document.getElementById(id);if(el){el.textContent=v;el.classList.remove('loading');}};
    if(d.rates?.CAD) set('cad-ov',(1/d.rates.CAD).toFixed(4));
    set('usd-ov','See TradingView ↑');
  }catch{}
  try{
    const d=await(await fetch('https://api.allorigins.win/raw?url='+encodeURIComponent('https://api.metals.live/v1/spot/oil'))).json();
    const el=document.getElementById('oil-ov');
    if(el&&d?.price){el.textContent='$'+Number(d.price).toFixed(2);el.classList.remove('loading');}
  }catch{const el=document.getElementById('oil-ov');if(el){el.textContent='See TradingView ↑';el.classList.remove('loading');}}
}

// ════════════════════════════════════════════════════════
// BUILD PANELS
// ════════════════════════════════════════════════════════
function buildPanels(){
  const root=document.getElementById('panels');
  TABS.forEach(tab=>{
    const pn=document.createElement('div');
    pn.className='pn'+(tab.id==='overview'?' on':'');
    pn.id='pn-'+tab.id;
    pn.innerHTML=`
      <div class="sec-hdr">
        <div>
          <div class="sec-title" style="color:${tab.color}">${esc(tab.name)}</div>
          <div class="sec-sub">${esc(tab.sub)}</div>
        </div>
      </div>
      ${tab.id==='overview'?renderOverviewCards():''}
      ${renderSectorTicker(tab)}
      ${renderStocksWidget(tab)}
      ${renderCompanies(tab)}
      ${tab.companies.length?'<div class="sec-divider"></div>':''}
      <div id="news-${tab.id}"></div>
    `;
    root.appendChild(pn);
    renderNews(tab.id);
  });
}

// ════════════════════════════════════════════════════════
// TABS + INIT
// ════════════════════════════════════════════════════════
function initTabs(){
  document.querySelectorAll('.tb').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.tb').forEach(b=>b.classList.remove('on'));
      document.querySelectorAll('.pn').forEach(p=>p.classList.remove('on'));
      btn.classList.add('on');
      const id=btn.dataset.tab;
      document.getElementById('pn-'+id).classList.add('on');
      if(!cache[id])loadNews(id);
    });
  });
}

buildPanels();
initTabs();
loadMacroCards();
loadNews('overview');
</script>

</html>
