
<style>
*{box-sizing:border-box;margin:0;padding:0}
.d{font-family:var(--font-sans);padding-bottom:1.5rem}
.dh{display:flex;align-items:center;justify-content:space-between;padding:.9rem 0 .75rem;border-bottom:0.5px solid var(--color-border-tertiary);margin-bottom:.9rem}
.dt{font-size:16px;font-weight:500;color:var(--color-text-primary);letter-spacing:-.02em}
.dt span{color:#D4A843}
.dm{font-size:10.5px;color:var(--color-text-tertiary);text-align:right;line-height:1.65}
.tabs{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:.9rem}
.tb{font-size:12px;font-weight:500;padding:5px 12px;border-radius:99px;border:0.5px solid var(--color-border-tertiary);background:transparent;cursor:pointer;color:var(--color-text-secondary);transition:all .15s}
.tb:hover{background:var(--color-background-secondary);color:var(--color-text-primary)}
.tb.on{background:#D4A843;border-color:#D4A843;color:#fff}
.pn{display:none}.pn.on{display:block}
.pt{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:.9rem;flex-wrap:wrap;gap:8px}
.pname{font-size:14.5px;font-weight:500;color:var(--color-text-primary)}
.srcs{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.sb{font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;padding:2px 7px;border-radius:4px;border:1px solid}
.rfb{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:5px 12px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:transparent;cursor:pointer;color:var(--color-text-primary);transition:background .15s}
.rfb:hover{background:var(--color-background-secondary)}
.rfb:disabled{opacity:.35;cursor:not-allowed}
.rfb svg{width:13px;height:13px;flex-shrink:0}
.spin{animation:sp .7s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.ng{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:10px}
.nc{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1rem 1.1rem;display:flex;flex-direction:column;gap:7px;transition:border-color .15s;cursor:pointer}
.nc:hover{border-color:var(--color-border-secondary)}
.cm{display:flex;align-items:center;justify-content:space-between}
.cs{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.ca{font-size:11px;color:var(--color-text-tertiary)}
.ct{font-size:13.5px;font-weight:500;color:var(--color-text-primary);line-height:1.42;letter-spacing:-.01em}
.cq{font-size:12.5px;color:var(--color-text-secondary);line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.cf{padding-top:7px;border-top:0.5px solid var(--color-border-tertiary);margin-top:auto}
.rl{font-size:11.5px;font-weight:500;color:#D4A843;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.rl:hover{color:#E8C876}
.rl svg{width:11px;height:11px}
.skg{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:10px}
.skc{background:var(--color-background-secondary);border-radius:var(--border-radius-lg);height:150px;animation:pulse 1.5s ease infinite}@keyframes pulse{0%,100%{opacity:.6}50%{opacity:.3}}
.es{text-align:center;padding:2.5rem 1rem;color:var(--color-text-tertiary)}
.es-i{font-size:28px;opacity:.25;margin-bottom:8px}
.es-t{font-size:13px;font-weight:500;color:var(--color-text-secondary);margin-bottom:3px}
.es-s{font-size:12px}
.er{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;color:var(--color-text-danger,#A32D2D);padding:.65rem .9rem;border:0.5px solid var(--color-border-danger,#F09595);border-radius:var(--border-radius-md);background:var(--color-background-danger,#FCEBEB);line-height:1.5}
.er svg{width:15px;height:15px;flex-shrink:0;margin-top:1px}
.lup{font-size:11px;color:var(--color-text-tertiary)}
.ss{margin-top:1.25rem;border-top:0.5px solid var(--color-border-tertiary);padding-top:1rem}
.st{background:none;border:none;font-size:11px;font-weight:500;color:var(--color-text-tertiary);letter-spacing:.07em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;gap:6px}
.st:hover{color:var(--color-text-secondary)}
.sg{display:none;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:7px;margin-top:.9rem}
.si{display:flex;align-items:center;gap:9px;padding:8px 11px;background:var(--color-background-secondary);border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-tertiary)}
.sd{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sn{font-size:12px;font-weight:500;color:var(--color-text-primary)}
.sc{font-size:10.5px;color:var(--color-text-tertiary)}
</style>

<div class="d">
  <div class="dh">
    <div>
      <div class="dt">Market <span>Intelligence</span></div>
      <div style="font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--color-text-tertiary);margin-top:2px">PowerOne Capital Markets</div>
    </div>
    <div class="dm"><div id="clk"></div><div id="mkt" style="margin-top:2px"></div></div>
  </div>
  <div class="tabs" id="tabs">
    <button class="tb on" data-tab="gold">◈ Gold &amp; Metals</button>
    <button class="tb" data-tab="mining">⬡ Mining</button>
    <button class="tb" data-tab="macro">◉ Global Macro</button>
    <button class="tb" data-tab="canada">◎ Canada</button>
    <button class="tb" data-tab="us">◇ United States</button>
    <button class="tb" data-tab="europe">○ Europe</button>
  </div>
  <div id="panels"></div>
  <div class="ss">
    <button class="st" onclick="toggleSrc()">▸ Data Sources &amp; References <span id="scnt" style="color:var(--color-text-tertiary);font-weight:400"></span></button>
    <div class="sg" id="sg"></div>
  </div>
</div>

<script>
const TABS=[
  {id:'gold',name:'Gold & Metals',feeds:[
    {url:'https://www.kitco.com/rss/',src:'Kitco News',color:'#F5A623'},
    {url:'https://www.mining.com/category/gold/feed/',src:'Mining.com',color:'#4CAF50'},
    {url:'https://feeds.reuters.com/reuters/commoditiesNews',src:'Reuters',color:'#E85D26'}
  ]},
  {id:'mining',name:'Mining',feeds:[
    {url:'https://www.mining.com/feed/',src:'Mining.com',color:'#4CAF50'},
    {url:'https://www.mining.com/category/copper/feed/',src:'Mining.com · Copper',color:'#CD7F32'},
    {url:'https://feeds.reuters.com/reuters/commoditiesNews',src:'Reuters',color:'#E85D26'}
  ]},
  {id:'macro',name:'Global Macro',feeds:[
    {url:'https://feeds.reuters.com/reuters/businessNews',src:'Reuters',color:'#E85D26'},
    {url:'https://feeds.bbci.co.uk/news/business/rss.xml',src:'BBC Business',color:'#BB1919'},
    {url:'https://www.cnbc.com/id/100003114/device/rss/rss.html',src:'CNBC',color:'#0097D4'}
  ]},
  {id:'canada',name:'Canada',feeds:[
    {url:'https://www.bnnbloomberg.ca/rss',src:'BNN Bloomberg',color:'#1967D2'},
    {url:'https://financialpost.com/feed/',src:'Financial Post',color:'#E31837'},
    {url:'https://www.theglobeandmail.com/arc/outboundfeeds/rss/category/business/',src:'Globe & Mail',color:'#0073CF'}
  ]},
  {id:'us',name:'United States',feeds:[
    {url:'https://feeds.marketwatch.com/marketwatch/topstories/',src:'MarketWatch',color:'#00AC4F'},
    {url:'https://www.cnbc.com/id/100003114/device/rss/rss.html',src:'CNBC',color:'#0097D4'},
    {url:'https://feeds.reuters.com/reuters/businessNews',src:'Reuters',color:'#E85D26'}
  ]},
  {id:'europe',name:'Europe',feeds:[
    {url:'https://feeds.bbci.co.uk/news/business/rss.xml',src:'BBC Business',color:'#BB1919'},
    {url:'https://feeds.reuters.com/reuters/europeanFinancialNews',src:'Reuters Europe',color:'#E85D26'},
    {url:'https://www.theguardian.com/uk/business/rss',src:'The Guardian',color:'#052962'}
  ]}
];

const PROXIES=[
  u=>`https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
  u=>`https://corsproxy.io/?${encodeURIComponent(u)}`,
  u=>`https://thingproxy.freeboard.io/fetch/${u}`
];

const cache={};

function tick(){
  const now=new Date();
  const c=document.getElementById('clk');
  if(c)c.textContent=now.toLocaleString('en-CA',{weekday:'short',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:true,timeZone:'America/Toronto'});
  const et=new Date(now.toLocaleString('en-US',{timeZone:'America/New_York'}));
  const d=et.getDay(),m=et.getHours()*60+et.getMinutes(),open=d>=1&&d<=5&&m>=570&&m<960;
  const mk=document.getElementById('mkt');
  if(mk){mk.textContent=open?'● Open':'○ Closed';mk.style.color=open?'#4CAF50':undefined;}
}
tick();setInterval(tick,30000);

function strip(h){return(h||'').replace(/<!\[CDATA\[|\]\]>/g,'').replace(/<[^>]*>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&nbsp;/g,' ').replace(/&#\d+;/g,'').trim();}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function ago(d){const s=(Date.now()-new Date(d))/1000;if(isNaN(s)||s<0)return'Recently';if(s<60)return'Just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago';}

function parseXML(xml,feed){
  const parser=new DOMParser();
  const doc=parser.parseFromString(xml,'text/xml');
  return Array.from(doc.querySelectorAll('item')).slice(0,8).map(item=>{
    const g=t=>strip((item.querySelector(t)||{}).textContent||'');
    const title=g('title');
    const desc=(g('description')||g('summary')).slice(0,230);
    let url='';
    const lel=item.querySelector('link');
    if(lel){const h=lel.getAttribute('href');url=h||(lel.textContent||'').trim();}
    if(!url||!url.startsWith('http')){const gd=item.querySelector('guid');if(gd){const t=(gd.textContent||'').trim();if(t.startsWith('http'))url=t;}}
    return{title,summary:desc,url,date:g('pubDate')||g('published')||'',src:feed.src,color:feed.color};
  }).filter(a=>a.title&&a.title.length>10);
}

async function fetchFeed(feed){
  for(const pFn of PROXIES){
    try{
      const r=await fetch(pFn(feed.url),{signal:AbortSignal.timeout(7000)});
      if(!r.ok)continue;
      const txt=await r.text();
      if(!txt.includes('<item')&&!txt.includes('<entry'))continue;
      const items=parseXML(txt,feed);
      if(items.length)return items;
    }catch(e){continue;}
  }
  return [];
}

async function loadTab(id){
  const tab=TABS.find(t=>t.id===id);if(!tab)return;
  cache[id]={status:'loading'};paint(id);
  try{
    const res=await Promise.allSettled(tab.feeds.map(fetchFeed));
    const arts=[];res.forEach(r=>{if(r.status==='fulfilled')arts.push(...r.value);});
    if(!arts.length)throw new Error('All feeds blocked — this preview works best on GitHub Pages. Download the file to host it.');
    const seen=new Set();
    const final=arts.sort((a,b)=>new Date(b.date)-new Date(a.date)).filter(a=>{const k=a.title.slice(0,50).toLowerCase();if(seen.has(k))return false;seen.add(k);return true;}).slice(0,12);
    cache[id]={status:'done',articles:final,time:new Date().toLocaleTimeString('en-CA',{hour:'2-digit',minute:'2-digit',hour12:true})};
  }catch(e){cache[id]={status:'error',msg:e.message};}
  paint(id);
}

function bdg(tab){return tab.feeds.map(f=>`<span class="sb" style="color:${f.color};border-color:${f.color}55;background:${f.color}18">${f.src}</span>`).join('');}
function topRow(tab,s){
  const loading=s?.status==='loading';
  return`<div class="pt"><div><div class="pname">${tab.name}</div><div class="srcs">${bdg(tab)}</div></div><div style="display:flex;align-items:center;gap:8px">${s?.time?`<span class="lup">Updated ${s.time}</span>`:''}<button class="rfb" onclick="loadTab('${tab.id}')" ${loading?'disabled':''}><svg viewBox="0 0 16 16" fill="none" class="${loading?'spin':''}"><path d="M13.5 8A5.5 5.5 0 1 1 8 2.5a5.5 5.5 0 0 1 3.9 1.6L13.5 2.5V6h-3.5l1.4-1.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>${loading?'Fetching…':'Refresh'}</button></div></div>`;
}

function paint(id){
  const tab=TABS.find(t=>t.id===id);const el=document.getElementById('pn-'+id);if(!el||!tab)return;
  const s=cache[id];
  if(!s){el.innerHTML=topRow(tab,null)+`<div class="es"><div class="es-i">📡</div><div class="es-t">Ready to load</div><div class="es-s">Click Refresh to pull headlines from ${tab.feeds.map(f=>f.src).join(', ')}</div></div>`;return;}
  if(s.status==='loading'){el.innerHTML=topRow(tab,s)+`<div class="skg">${[0,1,2,3,4,5].map(()=>`<div class="skc"></div>`).join('')}</div>`;return;}
  if(s.status==='error'){el.innerHTML=topRow(tab,s)+`<div class="er"><svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.4"/><path d="M8 5v4M8 11v.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span>${esc(s.msg)}</span></div>`;return;}
  if(s.status==='done'){el.innerHTML=topRow(tab,s)+`<div class="ng">${s.articles.map(a=>`<div class="nc" onclick="window.open('${esc(a.url)}','_blank')"><div class="cm"><span class="cs" style="color:${a.color}">${esc(a.src)}</span><span class="ca">${ago(a.date)}</span></div><div class="ct">${esc(a.title)}</div><div class="cq">${esc(a.summary)}</div><div class="cf"><a class="rl" href="${esc(a.url)}" target="_blank" onclick="event.stopPropagation()">Read article <svg viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></a></div></div>`).join('')}</div>`;}
}

function buildSrc(){
  const g=document.getElementById('sg');const seen=new Set();const all=[];
  TABS.forEach(t=>t.feeds.forEach(f=>{if(!seen.has(f.src)){seen.add(f.src);all.push({...f,cat:t.name});}}));
  document.getElementById('scnt').textContent='('+all.length+')';
  g.innerHTML=all.map(s=>`<div class="si"><div class="sd" style="background:${s.color}"></div><div><div class="sn">${esc(s.src)}</div><div class="sc">${esc(s.cat)}</div></div></div>`).join('');
}

function toggleSrc(){
  const g=document.getElementById('sg'),t=document.querySelector('.st');
  const open=g.style.display==='grid';g.style.display=open?'none':'grid';
  t.firstChild.textContent=open?'▸ Data Sources & References ':'▾ Data Sources & References ';
}

function init(){
  const panels=document.getElementById('panels');
  TABS.forEach(t=>{const d=document.createElement('div');d.className='pn'+(t.id==='gold'?' on':'');d.id='pn-'+t.id;panels.appendChild(d);paint(t.id);});
  document.querySelectorAll('.tb').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.tb').forEach(b=>b.classList.remove('on'));
      document.querySelectorAll('.pn').forEach(p=>p.classList.remove('on'));
      btn.classList.add('on');const id=btn.dataset.tab;
      document.getElementById('pn-'+id).classList.add('on');
      if(!cache[id])loadTab(id);
    });
  });
  buildSrc();loadTab('gold');
}
init();
</script>
